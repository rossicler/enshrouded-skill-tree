version: 1
frontend:
  phases:
    preBuild:
      commands:
        # The build image defaults to Node 22, but package.json requires 24.x.
        # A fresh nvm Node has no global yarn, so install the version yarn.lock was written with.
        - nvm install 24
        - npm install -g yarn@1.22.22
        - node --version && yarn --version
        # The cached node_modules can hold a stale copy of the workspace package
        # instead of its link to packages/core, and yarn skips relinking when the
        # lockfile is unchanged. Drop it and check files so the build uses the repo's core.
        - rm -rf node_modules/@enshrouded
        - yarn install --check-files
    build:
      commands:
        # Next.js server code on Amplify only sees env vars written to .env.production.
        - env | grep -e '^MONGODB_URI=' -e '^BASE_URL=' >> .env.production
        - env | grep -e '^NEXT_PUBLIC_' >> .env.production
        - yarn run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
